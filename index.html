<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <header class="topbar">
    <h1>Employee Dashboard</h1>

    <div class="stats">
      <div class="stat">
        <span id="totalCount">--</span>
        <small>Total</small>
      </div>

      <div class="stat">
        <span id="activeCount">--</span>
        <small>Active</small>
      </div>
    </div>
  </header>

  <div class="search-wrapper">
    <input id="searchInput" placeholder="Search employees...">
  </div>

  <div id="resultCount"></div>

  <div id="loader" class="loader">Loading....</div>

  <div id="results" class="grid"></div>

</div>

<div id="toast"></div>

<!-- Floating Theme Button -->
<button id="themeToggle" class="theme-toggle">🌙</button>

<div id="editModal" class="modal hidden">
  <div class="modal-box edit-card">

    <div class="edit-header">
      <h3>✏️ Edit Employee</h3>
      <span class="mini-id">ID: <b id="editEmpIdText"></b></span>
    </div>

    <div class="edit-grid">

      <div class="field">
        <label>Employee Name</label>
        <input id="editName" type="text">
      </div>

      <div class="field">
        <label>Employee Designation</label>
        <select id="editDesig"></select>
      </div>

      <div class="field">
        <label>State</label>
        <input id="editState" type="text">
      </div>

      <div class="field">
        <label>Zone</label>
        <input id="editZone" type="text">
      </div>

      <div class="field">
        <label>Branch ID</label>
        <input id="editBranchId" type="text">
      </div>

      <div class="field">
        <label>Branch Name</label>
        <input id="editBranch" type="text">
      </div>

      <div class="field">
        <label>Super ID</label>
        <input id="editSuperId" type="text">
      </div>

      <div class="field">
        <label>Super Name</label>
        <input id="editSuperName" type="text">
      </div>

      <div class="field">
        <label>Super Designation</label>
        <select id="editSuperDesig"></select>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="editStatus">
          <option value="active">Active</option>
          <option value="deactive">Deactive</option>
        </select>
      </div>

    </div>

    <div class="modal-actions">
      <button id="cancelEdit">Cancel</button>
      <button id="saveEdit" class="safe-btn">Save</button>
    </div>

  </div>
</div>

<button id="addBtn" class="fab">+</button>

<div id="addModal" class="modal hidden">
  <div class="modal-box edit-card">

    <div class="edit-header">

    </div>

    <div class="edit-grid">

      <div class="field">
        <label>Employee ID</label>

      </div>

      <div class="field">
        <label>Super ID</label>
        <input id="addSuperId" placeholder="00000">
      </div>

      <div class="field">
        <label>Employee Name</label>
        <input id="addName">
      </div>

      <div class="field">
        <label>Super Name</label>
        <input id="addSuperName">
      </div>

      <div class="field">
        <label>Employee Designation</label>

      </div>

      <div class="field">
        <label>State</label>

      </div>

      <div class="field">
        <label>Zone</label>

      </div>

      </div>

      <div class="field">

    <div class="modal-actions">

    </div>

  </div>
</div>


<script src="script.js"></script>
